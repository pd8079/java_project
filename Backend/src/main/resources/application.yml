spring:
  application:
    name: cyberops-arena
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cyberops_arena}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:cyberops}
    password: ${DB_PASSWORD:cyberops-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration-seconds: ${JWT_EXPIRATION:1800}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
