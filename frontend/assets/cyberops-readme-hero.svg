<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">CyberOps Arena</title>
  <desc id="desc">Build, simulate, and defend in a safe cyber security learning space.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07131e"/><stop offset=".55" stop-color="#111e34"/><stop offset="1" stop-color="#191531"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#39d8ef"/><stop offset="1" stop-color="#8968ff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#30d7ed" stop-opacity=".23"/><stop offset="1" stop-color="#30d7ed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#a5d7f3" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="30" fill="url(#grid)"/>
  <ellipse cx="960" cy="195" rx="330" ry="280" fill="url(#halo)"/>
  <path d="M40 35h1120a24 24 0 0 1 24 24v272a24 24 0 0 1-24 24H40a24 24 0 0 1-24-24V59a24 24 0 0 1 24-24Z" fill="none" stroke="#8ab8da" stroke-opacity=".15"/>
