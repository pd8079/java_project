  </g>
  <circle cx="756" cy="145" r="4" fill="#dcfbff" filter="url(#softGlow)"/><circle cx="879" cy="112" r="4" fill="#e5ddff" filter="url(#softGlow)"/><circle cx="1000" cy="168" r="4" fill="#dcfbff" filter="url(#softGlow)"/><circle cx="1091" cy="103" r="4" fill="#e5ddff" filter="url(#softGlow)"/>
