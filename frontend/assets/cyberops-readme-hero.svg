    <circle cx="96" cy="97.5" r="4" fill="#55e4ff" filter="url(#softGlow)"/>
    <text x="111" y="102" fill="#8feeff" font-size="12" font-weight="700" letter-spacing="2.3">A SAFE CYBER RANGE</text>
    <text x="74" y="179" fill="#f2f7ff" font-size="47" font-weight="800" letter-spacing="-1.8">CyberOps Arena</text>
    <text x="77" y="221" fill="#55e4ff" font-size="21" font-weight="800" letter-spacing="2.5">BUILD. SIMULATE. DEFEND.</text>
    <text x="78" y="263" fill="#b6c5dd" font-size="17">Practice security skills in a pretend network.</text>
    <text x="78" y="292" fill="#8da3c2" font-size="14">Explore alerts • Learn response • Keep it isolated</text>
  </g>
