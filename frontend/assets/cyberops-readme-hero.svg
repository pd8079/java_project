    <g transform="translate(1008 216)"><circle r="39" fill="#0b1b2b" stroke="#49d9f0" stroke-width="2"/><circle r="31" fill="none" stroke="#49d9f0" stroke-opacity=".18"/><ellipse rx="17" ry="6" cy="-14" fill="none" stroke="#a5f3ff" stroke-width="2"/><path d="M-17-14v26c0 8 34 8 34 0v-26m-34 9c0 8 34 8 34 0m-34 9c0 8 34 8 34 0" fill="none" stroke="#a5f3ff" stroke-width="2"/><text y="60" fill="#bfefff" font-size="11" font-weight="700" letter-spacing="1">DATABASE</text></g>
